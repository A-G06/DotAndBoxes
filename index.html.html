<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dots &amp; Boxes — Neon Arcade</title>
<style>
  :root {
    --p1: #00f0ff;
    --p1-dim: rgba(0, 240, 255, 0.16);
    --p2: #ff007f;
    --p2-dim: rgba(255, 0, 127, 0.16);
    --bg: #000000;
    --panel: #0a0a0a;
    --line-idle: #2a2a2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    padding: 16px;
  }

  /* ---------- Scoreboard ---------- */
  #scoreboard {
    width: min(92vw, 520px);
    display: flex; gap: 12px;
  }
  .player-card {
    flex: 1;
    background: var(--panel);
    border: 1px solid #1c1c1f;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transform: scale(1);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .player-card .name {
    font-size: 11px; letter-spacing: 2px; font-weight: 700; opacity: 0.75;
  }
  .player-card .score {
    font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  #p1Card .name, #p1Card .score { color: var(--p1); }
  #p2Card .name, #p2Card .score { color: var(--p2); }

  #p1Card.active {
    transform: scale(1.08);
    border-color: var(--p1);
    box-shadow: 0 0 10px rgba(0,240,255,0.35), 0 0 26px rgba(0,240,255,0.18);
  }
  #p2Card.active {
    transform: scale(1.08);
    border-color: var(--p2);
    box-shadow: 0 0 10px rgba(255,0,127,0.35), 0 0 26px rgba(255,0,127,0.18);
  }

  /* ---------- Board ---------- */
  #boardWrap {
    width: min(92vw, 520px);
    aspect-ratio: 1 / 1;
    position: relative;
  }
  #board { display: block; width: 100%; height: 100%; touch-action: none; }

  #hint {
    color: #55555c;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-align: center;
  }

  /* ---------- Winner modal ---------- */
  #modalOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.82);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #modalOverlay.show { opacity: 1; pointer-events: auto; }
  #modalBox {
    background: var(--panel);
    border: 1px solid #222;
    border-radius: 18px;
    padding: 34px 30px;
    text-align: center;
    width: min(84vw, 360px);
    transform: translateY(8px) scale(0.96);
    transition: transform 0.25s ease;
  }
  #modalOverlay.show #modalBox { transform: translateY(0) scale(1); }
  #modalTitle {
    font-size: 22px; font-weight: 800; letter-spacing: 1px;
    margin-bottom: 22px;
  }
  #modalTitle.win-p1 { color: var(--p1); text-shadow: 0 0 14px rgba(0,240,255,0.7); }
  #modalTitle.win-p2 { color: var(--p2); text-shadow: 0 0 14px rgba(255,0,127,0.7); }
  #modalTitle.win-tie { color: #ddd; }
  #playAgainBtn {
    background: #ffffff;
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 12px 26px;
    font-size: 14px; font-weight: 800; letter-spacing: 1.5px;
    cursor: pointer;
  }
  #playAgainBtn:active { transform: scale(0.97); }
</style>
</head>
<body>

<div id="scoreboard">
  <div class="player-card active" id="p1Card">
    <div class="name">PLAYER 1</div>
    <div class="score" id="p1Score">0</div>
  </div>
  <div class="player-card" id="p2Card">
    <div class="name">PLAYER 2</div>
    <div class="score" id="p2Score">0</div>
  </div>
</div>

<div id="boardWrap">
  <canvas id="board"></canvas>
</div>

<div id="hint">TAP AN EDGE TO CLAIM IT</div>

<div id="modalOverlay">
  <div id="modalBox">
    <div id="modalTitle">PLAYER 1 WINS</div>
    <button id="playAgainBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =====================================================================
     GRID CONFIG — 5x5 boxes => 6x6 dots
  ===================================================================== */
  const GRID = 5;                 // boxes per side
  const LOGICAL_SIZE = 500;       // fixed logical coordinate space
  const PADDING = 34;
  const SPAN = LOGICAL_SIZE - PADDING * 2;
  const CELL = SPAN / GRID;
  const DOT_R = 5;
  const LINE_W = 6;
  const HIT_THRESHOLD = 15;       // logical px, proximity for line selection

  const COLORS = { 1: '#00f0ff', 2: '#ff007f' };
  const COLORS_DIM = { 1: 'rgba(0,240,255,0.14)', 2: 'rgba(255,0,127,0.14)' };
  const COLORS_GLOW = { 1: 'rgba(0,240,255,0.9)', 2: 'rgba(255,0,127,0.9)' };

  function dot(r, c) { return { x: PADDING + c * CELL, y: PADDING + r * CELL }; }

  /* =====================================================================
     STATE
  ===================================================================== */
  let hLines, vLines, boxes, scores, currentPlayer, gameOver, hoverLine;

  function freshState() {
    hLines = Array.from({ length: GRID + 1 }, () => Array(GRID).fill(0));     // [r][c] r:0..5, c:0..4
    vLines = Array.from({ length: GRID }, () => Array(GRID + 1).fill(0));     // [r][c] r:0..4, c:0..5
    boxes = Array.from({ length: GRID }, () => Array(GRID).fill(0));         // [r][c] owner 0/1/2
    scores = { 1: 0, 2: 0 };
    currentPlayer = 1;
    gameOver = false;
    hoverLine = null;
  }
  freshState();

  /* =====================================================================
     GAME LOGIC
  ===================================================================== */
  function boxEdgesOwned(r, c) {
    return hLines[r][c] && hLines[r + 1][c] && vLines[r][c] && vLines[r][c + 1];
  }

  function claimLine(line) {
    if (gameOver || !line) return;
    const { type, r, c } = line;
    if (type === 'h') {
      if (hLines[r][c]) return;
      hLines[r][c] = currentPlayer;
    } else {
      if (vLines[r][c]) return;
      vLines[r][c] = currentPlayer;
    }

    // find boxes that might have just completed
    let affected = [];
    if (type === 'h') {
      if (r - 1 >= 0) affected.push({ r: r - 1, c });
      if (r < GRID) affected.push({ r: r, c });
    } else {
      if (c - 1 >= 0) affected.push({ r: r, c: c - 1 });
      if (c < GRID) affected.push({ r: r, c: c });
    }

    let completedAny = false;
    for (const box of affected) {
      if (boxes[box.r][box.c] === 0 && boxEdgesOwned(box.r, box.c)) {
        boxes[box.r][box.c] = currentPlayer;
        scores[currentPlayer]++;
        completedAny = true;
      }
    }

    updateScoreboard();

    const totalBoxes = GRID * GRID;
    const filled = scores[1] + scores[2];
    if (filled >= totalBoxes) {
      endGame();
      return;
    }

    if (!completedAny) {
      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateActiveCard();
    }
  }

  function endGame() {
    gameOver = true;
    const title = document.getElementById('modalTitle');
    title.classList.remove('win-p1', 'win-p2', 'win-tie');
    if (scores[1] > scores[2]) { title.textContent = 'PLAYER 1 WINS'; title.classList.add('win-p1'); }
    else if (scores[2] > scores[1]) { title.textContent = 'PLAYER 2 WINS'; title.classList.add('win-p2'); }
    else { title.textContent = "IT'S A TIE"; title.classList.add('win-tie'); }
    document.getElementById('modalOverlay').classList.add('show');
  }

  function resetGame() {
    freshState();
    document.getElementById('modalOverlay').classList.remove('show');
    updateScoreboard();
    updateActiveCard();
  }

  /* =====================================================================
     DOM / SCOREBOARD
  ===================================================================== */
  const p1ScoreEl = document.getElementById('p1Score');
  const p2ScoreEl = document.getElementById('p2Score');
  const p1Card = document.getElementById('p1Card');
  const p2Card = document.getElementById('p2Card');

  function updateScoreboard() {
    p1ScoreEl.textContent = scores[1];
    p2ScoreEl.textContent = scores[2];
  }
  function updateActiveCard() {
    p1Card.classList.toggle('active', currentPlayer === 1);
    p2Card.classList.toggle('active', currentPlayer === 2);
  }

  document.getElementById('playAgainBtn').addEventListener('click', resetGame);

  /* =====================================================================
     CANVAS SETUP
  ===================================================================== */
  const canvas = document.getElementById('board');
  const wrap = document.getElementById('boardWrap');
  const ctx = canvas.getContext('2d');
  let renderScale = 1; // logical-to-CSS-px scale, used to convert pointer coords

  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    const size = Math.round(rect.width);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    renderScale = size / LOGICAL_SIZE;
    ctx.setTransform(dpr * renderScale, 0, 0, dpr * renderScale, 0, 0);
    draw();
  }
  window.addEventListener('resize', resizeCanvas);

  /* =====================================================================
     POINTER HANDLING (proximity line detection)
  ===================================================================== */
  function pointToSegDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  function findNearestLine(lx, ly) {
    let best = null, bestDist = HIT_THRESHOLD;

    for (let r = 0; r <= GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        if (hLines[r][c]) continue;
        const a = dot(r, c), b = dot(r, c + 1);
        const d = pointToSegDist(lx, ly, a.x, a.y, b.x, b.y);
        if (d < bestDist) { bestDist = d; best = { type: 'h', r, c }; }
      }
    }
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c <= GRID; c++) {
        if (vLines[r][c]) continue;
        const a = dot(r, c), b = dot(r + 1, c);
        const d = pointToSegDist(lx, ly, a.x, a.y, b.x, b.y);
        if (d < bestDist) { bestDist = d; best = { type: 'v', r, c }; }
      }
    }
    return best;
  }

  function getLogicalPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) / renderScale,
      y: (clientY - rect.top) / renderScale
    };
  }

  function onPointerMove(clientX, clientY) {
    if (gameOver) return;
    const pos = getLogicalPos(clientX, clientY);
    const line = findNearestLine(pos.x, pos.y);
    const changed = !sameLine(line, hoverLine);
    hoverLine = line;
    if (changed) draw();
  }

  function onPointerTap(clientX, clientY) {
    if (gameOver) return;
    const pos = getLogicalPos(clientX, clientY);
    const line = findNearestLine(pos.x, pos.y);
    if (line) {
      claimLine(line);
      hoverLine = null;
      draw();
    }
  }

  function sameLine(a, b) {
    if (!a && !b) return true;
    if (!a || !b) return false;
    return a.type === b.type && a.r === b.r && a.c === b.c;
  }

  // --- Mouse ---
  canvas.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
  canvas.addEventListener('mouseleave', () => { hoverLine = null; draw(); });
  canvas.addEventListener('click', (e) => onPointerTap(e.clientX, e.clientY));

  // --- Touch (explicit, passive:false to safely block native scroll) ---
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    if (t) onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    if (t) onPointerMove(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    if (t) onPointerTap(t.clientX, t.clientY);
  }, { passive: false });

  /* =====================================================================
     RENDER
  ===================================================================== */
  function drawLine(x1, y1, x2, y2, color, glow) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = LINE_W;
    ctx.strokeStyle = color;
    if (glow) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
    }
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);

    // box fills
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const owner = boxes[r][c];
        if (!owner) continue;
        const a = dot(r, c);
        ctx.save();
        ctx.fillStyle = COLORS_DIM[owner];
        ctx.shadowColor = COLORS_GLOW[owner];
        ctx.shadowBlur = 18;
        ctx.fillRect(a.x + LINE_W / 2, a.y + LINE_W / 2, CELL - LINE_W, CELL - LINE_W);
        ctx.restore();
      }
    }

    // horizontal lines
    for (let r = 0; r <= GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const a = dot(r, c), b = dot(r, c + 1);
        if (hLines[r][c]) {
          drawLine(a.x, a.y, b.x, b.y, COLORS[hLines[r][c]], true);
        }
      }
    }
    // vertical lines
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c <= GRID; c++) {
        const a = dot(r, c), b = dot(r + 1, c);
        if (vLines[r][c]) {
          drawLine(a.x, a.y, b.x, b.y, COLORS[vLines[r][c]], true);
        }
      }
    }

    // hover preview
    if (hoverLine && !gameOver) {
      const { type, r, c } = hoverLine;
      const a = type === 'h' ? dot(r, c) : dot(r, c);
      const b = type === 'h' ? dot(r, c + 1) : dot(r + 1, c);
      ctx.save();
      ctx.globalAlpha = 0.55;
      drawLine(a.x, a.y, b.x, b.y, COLORS[currentPlayer], true);
      ctx.restore();
    }

    // dots (drawn last, on top)
    for (let r = 0; r <= GRID; r++) {
      for (let c = 0; c <= GRID; c++) {
        const d = dot(r, c);
        ctx.beginPath();
        ctx.fillStyle = '#3a3a40';
        ctx.arc(d.x, d.y, DOT_R, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /* =====================================================================
     INIT
  ===================================================================== */
  updateScoreboard();
  updateActiveCard();
  resizeCanvas();
})();
</script>
</body>
</html>
